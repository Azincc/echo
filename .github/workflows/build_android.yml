name: Build Android

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.38.9

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        id: flutter-action
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache build_runner
        uses: actions/cache@v5
        with:
          path: .dart_tool/build
          key: ${{ runner.os }}-build-runner-${{ env.FLUTTER_VERSION }}-${{ hashFiles('lib/**/*.dart', 'test/**/*.dart', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-runner-${{ env.FLUTTER_VERSION }}-

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks

      - name: Create key.properties
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Verify tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pubspec_version=$(grep '^version:' pubspec.yaml | head -n1 | awk '{print $2}' | cut -d'+' -f1)
          if [[ -z "$pubspec_version" ]]; then
            echo "Cannot find version in pubspec.yaml"
            exit 1
          fi
          expected_tag="v${pubspec_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pubspec version ${pubspec_version}"
            exit 1
          fi

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (split per ABI)
        run: flutter build apk --release --no-pub --split-per-abi

      - name: Get version name
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            version=$(grep '^version:' pubspec.yaml | head -n1 | awk '{print $2}' | cut -d'+' -f1)
            echo "name=v${version}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ github.ref_name }}
        run: |
          assets=(
            "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
            "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk"
            "build/app/outputs/flutter-apk/app-x86_64-release.apk"
          )

          release_body="$(git for-each-ref "refs/tags/$RELEASE_NAME" --format='%(contents)')"
          if [[ -z "$release_body" ]]; then
            release_body="$(git log --format=%s -n 1)"
          fi

          if gh release view "$RELEASE_NAME" >/dev/null 2>&1; then
            gh release edit "$RELEASE_NAME" --title "$RELEASE_NAME" --notes "$release_body"
          elif ! gh release create "$RELEASE_NAME" --title "$RELEASE_NAME" --notes "$release_body"; then
            gh release view "$RELEASE_NAME" >/dev/null
            gh release edit "$RELEASE_NAME" --title "$RELEASE_NAME" --notes "$release_body"
          fi

          asset_exists() {
            local asset_name="$1"
            gh release view "$RELEASE_NAME" --json assets --jq '.assets[].name' | grep -Fxq "$asset_name"
          }

          upload_asset() {
            local asset_path="$1"
            local asset_name
            asset_name="$(basename "$asset_path")"

            if asset_exists "$asset_name"; then
              echo "Release asset already exists, skipping: $asset_name"
              return 0
            fi

            if gh release upload "$RELEASE_NAME" "$asset_path"; then
              return 0
            fi

            if asset_exists "$asset_name"; then
              echo "Release asset appeared during upload, skipping: $asset_name"
              return 0
            fi

            echo "Failed to upload release asset: $asset_name"
            return 1
          }

          for asset in "${assets[@]}"; do
            upload_asset "$asset"
          done
