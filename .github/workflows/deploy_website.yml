name: Publish Echoes Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy_website.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy_website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build static website
    runs-on: ubuntu-latest
    outputs:
      site_url: ${{ steps.site.outputs.url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve public website URL
        id: site
        env:
          CONFIGURED_SITE_URL: ${{ vars.WEBSITE_SITE_URL }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { normalizeSiteUrl } from './website/build.mjs';
          const url = normalizeSiteUrl(process.env.CONFIGURED_SITE_URL || undefined);
          appendFileSync(process.env.GITHUB_OUTPUT, `url=${url.href}\n`);
          NODE
      - name: Build bilingual pages and search metadata
        env:
          SITE_URL: ${{ steps.site.outputs.url }}
        run: node website/build.mjs
      - name: Check languages, metadata, and local resources
        run: node website/check.mjs
      - name: Upload static website artifact
        uses: actions/upload-artifact@v6
        with:
          name: echoes-website
          path: website/dist
          if-no-files-found: error
          retention-days: 7

  image-check:
    name: Validate multi-platform container and HTTP routes
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build both architectures without publishing
        uses: docker/build-push-action@v6
        with:
          context: website
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            SITE_URL=${{ needs.build.outputs.site_url }}
          cache-from: type=gha,scope=echoes-website
          cache-to: type=gha,mode=max,scope=echoes-website
      - name: Load native image from the existing build cache
        uses: docker/build-push-action@v6
        with:
          context: website
          platforms: linux/amd64
          push: false
          load: true
          tags: echoes-website:smoke
          build-args: |
            SITE_URL=${{ needs.build.outputs.site_url }}
      - name: Check hardened container startup and HTTP routes
        run: bash website/smoke-container.sh echoes-website:smoke

  pages:
    name: Publish to Cloudflare Pages
    needs: build
    # Leave this unset when Cloudflare Pages builds through its own Git integration.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: ${{ needs.build.outputs.site_url }}
    env:
      CI: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download verified static website
        uses: actions/download-artifact@v5
        with:
          name: echoes-website
          path: website/dist
      - name: Check Cloudflare deployment configuration
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN repository secret.}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID repository secret.}"
          : "${CLOUDFLARE_PAGES_PROJECT:?Set CLOUDFLARE_PAGES_PROJECT to an existing Pages project with production branch main.}"
      - name: Verify Cloudflare authentication
        run: npx --yes wrangler@4 whoami
      - name: Deploy to the existing Cloudflare Pages project
        run: npx --yes wrangler@4 pages deploy website/dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main

  image:
    name: Publish multi-platform container
    needs: [build, image-check]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Resolve lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-website" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,prefix=sha-,format=long
      - name: Build and publish AMD64 and ARM64 images
        uses: docker/build-push-action@v6
        with:
          context: website
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SITE_URL=${{ needs.build.outputs.site_url }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=echoes-website
          cache-to: type=gha,mode=max,scope=echoes-website
