services:
  website:
    image: ${WEBSITE_IMAGE:-ghcr.io/azincc/echo-website:latest}
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-http://localhost:8080/}
    ports:
      - "${WEBSITE_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
