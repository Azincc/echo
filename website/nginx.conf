worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Names are stable across releases: permit short caching, then revalidate.
    map $uri $cache_control {
        default "no-cache";
        ~*\.(?:png|jpe?g|webp|avif|gif|svg|ico|woff2?)$ "public, max-age=86400, must-revalidate";
        ~*\.(?:css|js)$ "public, max-age=3600, must-revalidate";
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        absolute_redirect off;
        error_page 404 /404.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control $cache_control;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /en {
            return 301 /en/$is_args$args;
        }

        # Redirect explicitly requested index files without redirecting internal index lookup.
        if ($request_uri ~ "^/index\.html(?:\?|$)") {
            return 301 /$is_args$args;
        }
        if ($request_uri ~ "^/en/index\.html(?:\?|$)") {
            return 301 /en/$is_args$args;
        }

        location = /404.html {
            internal;
        }

        location ~ /\. {
            deny all;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
